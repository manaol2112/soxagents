name: ai-workforce

services:
  postgres:
    image: postgres:18.6
    container_name: ai-workforce-postgres
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: "no"

  temporal:
    image: temporalio/auto-setup:1.29.7
    container_name: ai-workforce-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "127.0.0.1:7233", "workflow", "list"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: "no"

volumes:
  postgres_data:
    name: ai_workforce_postgres_data
