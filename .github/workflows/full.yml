name: Full suite

# G5, a milestone (docs/test-strategy.md §1): the whole Python suite, make test-full, on
# Linux. Run on demand from the Actions tab or `gh workflow run full.yml --ref <branch>`;
# it is not a required check and runs on no push. The gated live model tests skip here:
# no model key is configured.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.10.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.14.8"

      - name: Install Tesseract OCR
        run: make install-tesseract

      - name: Check toolchain
        run: make check

      - name: Install dependencies
        run: make install

      - name: Write local database env
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          umask 077
          cat > .env <<EOF
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${password}
          POSTGRES_DB=ai_workforce
          POSTGRES_PORT=5432
          DATABASE_URL=postgresql://postgres:${password}@localhost:5432/ai_workforce
          EMAIL_LIVE_SEND_ENABLED=false
          EOF
          unset password

      - name: Start PostgreSQL
        run: docker compose up -d --wait --wait-timeout 180 postgres

      - name: Full Python suite
        run: make test-full
