name: CI

# Runs on the branches work is actually done on, and on every pull request. Until 17 Nov
# 2026 it ran on main only, which no one had pushed to since 11 Oct.
on:
  push:
    branches: [main, windows-dev, macbook-pro-dev, governance]
  pull_request:

# A newer push to the same branch replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

# G4, the integration gate (docs/test-strategy.md §1). Until 19 Nov 2026 one job ran lint,
# types, the critical tier and every Node test in turn, in 26 to 42 minutes. The same checks
# now run side by side: the critical tier in four parts (make test-critical-shard; the split
# is deterministic and services/api/tests/test_ci_gate.py checks that the parts together are
# CRITICAL_PY exactly); the fast tier's files that are not critical (make test-fast-only),
# which no CI run reached before; and the production build of the web app, which no check
# compiled before. Branch protection requires `baseline`, which passes only when every part
# passed.
jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint and types
            make: lint typecheck
            database: false
            minutes: 20
          - name: critical 1 of 4
            make: test-critical-shard SHARD=1 SHARDS=4
            database: true
            minutes: 30
          - name: critical 2 of 4
            make: test-critical-shard SHARD=2 SHARDS=4
            database: true
            minutes: 30
          - name: critical 3 of 4
            make: test-critical-shard SHARD=3 SHARDS=4
            database: true
            minutes: 30
          - name: critical 4 of 4
            make: test-critical-shard SHARD=4 SHARDS=4
            database: true
            minutes: 30
          - name: fast only
            make: test-fast-only
            database: true
            minutes: 30
          - name: node tests
            make: test-node
            database: false
            minutes: 15
          - name: web build
            make: web-build
            database: false
            minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.10.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.14.8"

      - name: Install Tesseract OCR
        run: make install-tesseract

      - name: Check toolchain
        run: make check

      - name: Install dependencies
        run: make install

      - name: Write local database env
        if: matrix.database
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          umask 077
          cat > .env <<EOF
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${password}
          POSTGRES_DB=ai_workforce
          POSTGRES_PORT=5432
          DATABASE_URL=postgresql://postgres:${password}@localhost:5432/ai_workforce
          EMAIL_LIVE_SEND_ENABLED=false
          EOF
          unset password

      # The tests create their own databases on this server (services/api/tests/conftest.py).
      # Only PostgreSQL is started: Temporal and the object store are not needed by the gate.
      - name: Start PostgreSQL
        if: matrix.database
        run: docker compose up -d --wait --wait-timeout 180 postgres

      # A test part runs through scripts/run_tests.py: its summary is printed here, the
      # JUnit XML and the full log are in test-results/. On CI an environment error counts as
      # a failure and is never rerun.
      - name: Run
        env:
          MAKE_ARGS: ${{ matrix.make }}
        run: make $MAKE_ARGS

      - name: Summary of the part
        if: always() && matrix.database
        run: cat test-results/*/summary.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Log of a failed part
        if: failure() && matrix.database
        run: tail -n 200 test-results/*/pytest.log || true

  # The required check. A job whose needs failed would be skipped, and a skipped required
  # check counts as passed, so this one always runs and fails unless every part succeeded.
  baseline:
    needs: [gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of the gate passed
        env:
          RESULT: ${{ needs.gate.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "The gate's result is '$RESULT': a part failed, timed out or was cancelled."
            exit 1
          fi
          echo "Lint, types, the critical tier in four parts, the fast-only files, every Node test and the web build passed."
