name: Security

# Supply-chain checks (governance assessment, finding S2, 18 November 2026). Kept apart from
# CI so a new advisory on a dependency nobody changed does not block unrelated work: the scan
# for secrets runs on every push and pull request; the dependency audit when a lockfile
# changes, and every week for advisories published since.
on:
  push:
    branches: [main, windows-dev, macbook-pro-dev, governance]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout, with the whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A fixed release, checked against its published checksum. Findings already checked
      # by a person and not secrets are listed in .gitleaksignore; any other fails here.
      - name: Scan every commit for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --gitleaks-ignore-path .gitleaksignore

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Which lockfiles changed
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ] \
            || [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          if git diff --name-only "$BASE" HEAD | grep -qE '^(pnpm-lock\.yaml|uv\.lock|package\.json|pyproject\.toml|services/api/pyproject\.toml|apps/web/package\.json)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.changed.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Install uv and Python
        if: steps.changed.outputs.run == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.14.8"

      - name: Audit the web dependencies
        if: steps.changed.outputs.run == 'true'
        run: pnpm audit --audit-level=moderate

      # pip-audit at a fixed version, over exactly what uv.lock installs.
      - name: Audit the Python dependencies
        if: steps.changed.outputs.run == 'true'
        run: |
          set -euo pipefail
          uv export --frozen --all-packages --no-emit-workspace --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --progress-spinner off
