[project]
name = "ai-workforce-api"
version = "0.0.0"
description = "AI Employee Workforce API"
requires-python = ">=3.14.8,<3.15"
dependencies = [
    "anthropic==1.8.0",
    "boto3==1.40.61",
    "defusedxml==0.7.1",
    "dnspython==2.7.0",
    "fastapi==0.143.0",
    "msal==1.39.0",
    "openpyxl==3.1.5",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.15.1",
    "pypdf==6.19.0",
    "python-docx==1.2.0",
    "reportlab==4.5.1",
    "requests==2.34.2",
    "temporalio==1.34.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_workforce_api"]
