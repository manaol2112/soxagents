[project]
name = "ai-workforce"
version = "0.0.0"
description = "AI Employee Workforce platform"
readme = "README.md"
requires-python = ">=3.14.8,<3.15"
dependencies = []

[tool.uv]
package = false
required-version = "==0.13.0"

[tool.uv.workspace]
members = ["services/api"]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.17.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["tests", "services/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["tests", "services/api"]

[[tool.mypy.overrides]]
module = ["msal", "msal.*", "boto3", "boto3.*", "botocore", "botocore.*", "openpyxl", "openpyxl.*", "defusedxml", "defusedxml.*", "reportlab", "reportlab.*", "docx", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "services/api/tests"]
